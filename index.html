<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pao's Affiliates & Finds</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <header>
            <img src="img/paoaff_header.png>
        </header>

        <section id="featured" class="content-section">
            <h2>Featured Products</h2>
            <div class="quadrant-grid">
                
                <div class="product-card">
                    <div class="img-wrapper">
                        <a href="https://vt.tiktok.com/ZSHwX7BHuJ3YA-WYyPY/" target="_blank">
                        <img src="img/products/product01.png" alt="Featured Product 1">
                        </a>
                    </div>                
                </div>

                <div class="product-card">
                    <div class="img-wrapper">
                        <a href="https://vt.tiktok.com/ZSHwX7Xug93p2-cqYt8/" target="_blank" class="shop-btn">
                        <img src="img/products/product02.png" alt="Featured Product 2">
                        </a>
                    </div>               
                </div>

                <div class="product-card">
                    <div class="img-wrapper">
                        <a href="https://vt.tiktok.com/ZSHwX7w4AaE92-p8VXd/" target="_blank">
                        <img src="img/products/product03.png" alt="Featured Product 3">
                        </a>
                    </div>                  
                </div>

                <div class="product-card">
                    <div class="img-wrapper">
                        <a href="https://vt.tiktok.com/ZSHwXvBUtkb19-Wllt0/" target="_blank">
                        <img src="img/products/product04.png" alt="Featured Product 4">
                        </a>
                    </div>                  
                </div>

            </div>
        </section>

        <section class="carousel-container">
            <h2>More Categories</h2>
            <p class="swipe-hint">← Swipe to explore →</p>
            
            <div class="carousel-track">
                
                <div class="carousel-card clothing-bg">
                    <h3>Clothings</h3>
                    <p>Latest fashion trends</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

                <div class="carousel-card school-bg">
                    <h3>School & Office</h3>
                    <p>Supplies & Essentials</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

                <div class="carousel-card household-bg">
                    <h3>Household</h3>
                    <p>Home improvements</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

                <div class="carousel-card gadgets-bg">
                    <h3>Gadgets</h3>
                    <p>Electronics & Tech</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

                <div class="carousel-card car-bg">
                    <h3>Car & Moto</h3>
                    <p>Parts & Accessories</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

                <div class="carousel-card others-bg">
                    <h3>Others</h3>
                    <p>Miscellaneous Finds</p>
                    <button class="carousel-btn">View Collection</button>
                </div>

            </div>
        </section>

        <footer>
            <p>&copy; 2025 Pao's Affiliates & Finds</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

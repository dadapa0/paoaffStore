    <script>
        function showSection(sectionId) {
            // Hide all sections with class 'content-section'
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => {
                section.style.display = 'none';
            });

            // Show the selected section if ID exists, else default to featured
            const selected = document.getElementById(sectionId);
            if (selected) {
                selected.style.display = 'block';
            } else {
                // If selection is empty or invalid, show featured
                document.getElementById('featuredProducts').style.display = 'block';
            }
        }
    </script>
